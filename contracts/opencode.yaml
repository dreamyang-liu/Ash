# Upstream assumptions of harness/slots/opencode.py + normalize/opencode.py.
slot: opencode
upstream:
  binary: opencode
  verified_versions:
    cli: "1.18.5"

cli_flags:
  - "--format"      # json
  - "--dir"
  - "--pure"        # ignore developer plugins in eval runs
  - "--session"
  - "--fork"        # the only slot with native conversation fork
  - "--continue"
  - "-m"
  - "--variant"
  - "--agent"
  - "--thinking"
  - "--attach"      # future: long-lived server mode

env_vars:
  - OPENCODE_CONFIG   # per-slot config file; avoids mutating global config

# Envelope: {type, timestamp, sessionID, part:{...}}
event_types:
  - step_start
  - step_finish
  - text
  - tool_use

part_types:
  - step-start
  - step-finish
  - text
  - tool

attributes:
  tool: [tool, callID, state]
  tool_state: [status, input, output, time]
  step-finish: [reason, cost, tokens]

# part.tokens -> normalized Usage. tokens.total is ignored on purpose: it
# double counts cache writes.
usage_keys:
  input: input_tokens
  output: output_tokens
  reasoning: reasoning_output_tokens
  cache.read: cached_input_tokens
  cache.write: cache_creation_tokens

quirks:
  - 'one terminal tool_use event per call; TOOL_STARTED is synthesized (synthetic: true)'
  - 'tool state.status in {completed, error}; no separate start event'

behaviors:
  - id: json_format_emits_session_id
    why: needed for --session/--fork
  - id: fork_creates_new_session
    why: native conversation fork, the cheapest branch path of the three slots
