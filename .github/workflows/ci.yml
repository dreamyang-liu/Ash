name: CI

on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:
    branches: [main, dev]

jobs:
  go-build:
    name: Go Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go mod download
      - run: go build -o ash-runtime .
      - run: go vet ./...

  go-test:
    name: Go Integration Test
    runs-on: ubuntu-latest
    needs: go-build
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go build -o ash-runtime .

      - name: Test stdio mode
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' | ./ash-runtime --mode stdio | python3 -c "
          import sys, json
          data = json.loads(sys.stdin.read())
          tools = data['result']['tools']
          assert len(tools) == 6, f'Expected 6 tools, got {len(tools)}'
          names = [t['name'] for t in tools]
          assert 'shell' in names
          assert 'web_search' in names
          assert 'read_file' not in names
          print(f'OK: {len(tools)} tools registered')
          "

      - name: Test shell tool (stdio)
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"shell","arguments":{"command":"echo hello_ci"}}}' | ./ash-runtime --mode stdio | python3 -c "
          import sys, json
          data = json.loads(sys.stdin.read())
          assert data['result']['content'][0]['text'].strip() == 'hello_ci'
          assert data['result']['isError'] == False
          assert 'notifications' in data['result']
          print('OK: shell sync works')
          "

      - name: Test text_editor view (stdio)
        run: |
          echo 'line1' > /tmp/ci_test.txt
          echo 'line2' >> /tmp/ci_test.txt
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"text_editor","arguments":{"command":"view","path":"/tmp/ci_test.txt"}}}' | ./ash-runtime --mode stdio | python3 -c "
          import sys, json
          data = json.loads(sys.stdin.read())
          text = data['result']['content'][0]['text']
          assert 'line1' in text
          assert 'line2' in text
          print('OK: text_editor view works')
          "

      - name: Test text_editor write + str_replace (stdio)
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"text_editor","arguments":{"command":"write","path":"/tmp/ci_edit.txt","file_text":"hello world"}}}' | ./ash-runtime --mode stdio > /dev/null
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"text_editor","arguments":{"command":"str_replace","path":"/tmp/ci_edit.txt","old_str":"hello","new_str":"goodbye"}}}' | ./ash-runtime --mode stdio | python3 -c "
          import sys, json
          data = json.loads(sys.stdin.read())
          assert data['result']['isError'] == False
          print('OK: text_editor works')
          "
          grep -q 'goodbye world' /tmp/ci_edit.txt && echo 'OK: file was modified correctly'

      - name: Test HTTP mode
        run: |
          ./ash-runtime --port 19876 &
          sleep 2
          curl -sf -X POST http://localhost:19876 -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"shell","arguments":{"command":"echo http_ok"}}}' | python3 -c "
          import sys, json
          data = json.loads(sys.stdin.read())
          assert 'http_ok' in data['result']['content'][0]['text']
          print('OK: HTTP mode works')
          "
          kill %1 2>/dev/null || true

      - name: Test MCP endpoint
        run: |
          ./ash-runtime --port 19877 &
          sleep 2
          # Initialize
          curl -sf -X POST http://localhost:19877/mcp -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":0,"method":"initialize","params":{}}' | python3 -c "
          import sys, json
          data = json.loads(sys.stdin.read())
          assert data['result']['protocolVersion'] == '2025-03-26'
          print('OK: MCP initialize works')
          "
          # Call tool
          curl -sf -X POST http://localhost:19877/mcp -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"shell","arguments":{"command":"echo mcp_ok"}}}' | python3 -c "
          import sys, json
          data = json.loads(sys.stdin.read())
          assert 'mcp_ok' in data['result']['content'][0]['text']
          print('OK: MCP tool call works')
          "
          kill %1 2>/dev/null || true

      - name: Test background process + notifications
        run: |
          ./ash-runtime --port 19878 &
          sleep 2
          # Start background process
          PID=$(curl -sf -X POST http://localhost:19878 -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"shell","arguments":{"command":"echo bg_done","background":true}}}' | python3 -c "
          import sys, json
          data = json.loads(sys.stdin.read())
          print(json.loads(data['result']['content'][0]['text'])['pid'])
          ")
          sleep 1
          # Read output — should have notification
          curl -sf -X POST http://localhost:19878 -H 'Content-Type: application/json' \
            -d "{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/call\",\"params\":{\"name\":\"process\",\"arguments\":{\"pid\":\"$PID\",\"action\":\"read\"}}}" | python3 -c "
          import sys, json
          data = json.loads(sys.stdin.read())
          result = data['result']
          output = json.loads(result['content'][0]['text'])
          assert 'bg_done' in output['stdout']
          assert output['running'] == False
          assert len(result['notifications']) > 0
          assert result['notifications'][0]['kind'] == 'process_exited'
          print('OK: background + notifications work')
          "
          kill %1 2>/dev/null || true

  python-client:
    name: Python Client Test
    runs-on: ubuntu-latest
    needs: go-build
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ../sdk
      - run: go build -o ash-runtime .

      - name: Test Python client (HTTP + CLI + MCP backends)
        run: |
          ./ash-runtime --port 19879 &
          sleep 2
          python3 -c "
          import asyncio, sys, json
          from ash_sandbox import Sandbox

          async def main():
              # HTTP backend
              async with Sandbox.connect('http://localhost:19879') as sb:
                  r = await sb.call('shell', command='echo client_http')
                  assert 'client_http' in r.output, f'HTTP failed: {r.output}'
                  tools = await sb.tool_schemas(format='openai')
                  assert len(tools) == 6

              # MCP backend
              async with Sandbox.mcp('http://localhost:19879/mcp') as sb:
                  r = await sb.call('shell', command='echo client_mcp')
                  assert 'client_mcp' in r.output, f'MCP failed: {r.output}'

              # CLI backend
              async with Sandbox.local('./ash-runtime') as sb:
                  r = await sb.call('shell', command='echo client_cli')
                  assert 'client_cli' in r.output, f'CLI failed: {r.output}'

              # execute_tool_call (OpenAI format)
              async with Sandbox.connect('http://localhost:19879') as sb:
                  r = await sb.execute_tool_call({
                      'function': {'name': 'shell', 'arguments': json.dumps({'command': 'echo openai_format'})}
                  })
                  assert 'openai_format' in r.output

              # execute_tool_call (Anthropic format)
              async with Sandbox.connect('http://localhost:19879') as sb:
                  r = await sb.execute_tool_call({
                      'name': 'shell', 'input': {'command': 'echo anthropic_format'}
                  })
                  assert 'anthropic_format' in r.output

              print('ALL PYTHON CLIENT TESTS PASSED')

          asyncio.run(main())
          "
          kill %1 2>/dev/null || true
