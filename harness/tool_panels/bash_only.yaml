# Single-tool mode (mini-swe-agent's shape): one tool, one parameter.
#
# Named `shell`, not `bash`. The name used to be `bash`, mapped onto the runtime's
# `shell` by a route table that existed so an interceptor keyed on `shell` would not
# go blind in this mode. Calling the view `shell` removes the mapping and the table
# with it -- what this mode wants is one tool with one parameter, not a new name.

agent_tools:
  - name: shell
    description: |-
      Execute a shell command. Use it for everything: searching, reading, editing
      files, and running tests. Pipe long output through `tail`/`head` to save
      context. Working directory defaults to /testbed.
    arguments: [command]
    required: [command]
    # not offered: background, env, max_output_bytes, stdin, tail, timeout,
    #              truncate_mode, working_dir
