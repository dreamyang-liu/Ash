[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ash-sandbox"
version = "0.1.0"
description = "Python SDK for Ash — Agent Sandbox Hive"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.25"]

[project.urls]
Homepage = "https://github.com/dreamyang-liu/Ash"
Repository = "https://github.com/dreamyang-liu/Ash"

[tool.hatch.build.targets.wheel]
packages = ["ash_sandbox"]
